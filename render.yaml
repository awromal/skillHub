# Render Blueprint Specification File
# https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # Frontend Web Service (TanStack Start / React)
  # ----------------------------------------------------------------------------
  - type: web
    name: skillhub-frontend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:frontend
    startCommand: cd frontend && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: VITE_SUPABASE_URL
        value: https://jjrokbijleryrerfbyhi.supabase.co
      - key: VITE_SUPABASE_PROJECT_ID
        value: jjrokbijleryrerfbyhi
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_URL
        value: https://jjrokbijleryrerfbyhi.supabase.co
      - key: SUPABASE_PROJECT_ID
        value: jjrokbijleryrerfbyhi
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Backend Web Service (Nitro API Server)
  # ----------------------------------------------------------------------------
  - type: web
    name: skillhub-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:backend
    startCommand: cd backend && npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: SUPABASE_URL
        value: https://jjrokbijleryrerfbyhi.supabase.co
      - key: SUPABASE_PROJECT_ID
        value: jjrokbijleryrerfbyhi
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
